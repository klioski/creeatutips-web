<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller 3D CreeatuTip's</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Open+Sans:wght@600&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#14112f; --navy2:#2a2270; }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden}
  body{background:radial-gradient(ellipse at 50% 35%,var(--navy2),var(--navy) 72%);font-family:"Open Sans",sans-serif}
  .blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.45;pointer-events:none}
  canvas{position:fixed;inset:0;display:block;z-index:1}
  #strip,#sub{z-index:2}
  #strip{position:fixed;left:4%;right:4%;bottom:8%;overflow:hidden;white-space:nowrap;
    font:800 2.15vw Montserrat,sans-serif;color:#fff;opacity:.92}
  #strip span{display:inline-block}
  #sub{position:fixed;left:0;right:0;bottom:2.6%;text-align:center;font-weight:600;font-size:1.9vw;color:#b9b4e8}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="blob" id="b1" style="left:2%;top:12%;width:22vw;height:22vw;background:#00BFFF"></div>
<div class="blob" id="b2" style="right:2%;top:6%;width:24vw;height:24vw;background:#E91E63"></div>
<div class="blob" id="b3" style="right:4%;bottom:6%;width:22vw;height:22vw;background:#FFC93C"></div>
<div class="blob" id="b4" style="left:3%;bottom:4%;width:23vw;height:23vw;background:#5D54A4"></div>
<div id="strip"><span id="marquee"></span></div>
<div id="sub">Tu marca, hecha con 10 técnicas de personalización</div>

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

await document.fonts.ready;
const RENDER = /[?&]render/.test(location.search);

// ---------- renderer, cámara, luces ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(RENDER ? 1 : Math.min(2, devicePixelRatio));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
const camera = new THREE.PerspectiveCamera(33, 4 / 3, .1, 100);
camera.position.set(0, 4.2, 14.2);
camera.lookAt(0, 2.55, 0);

scene.add(new THREE.HemisphereLight(0xbfb6ff, 0x1a1540, .7));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4, 10, 8); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -4, near: 1, far: 30 });
key.shadow.radius = 4; key.shadow.bias = -.0006;
scene.add(key);
const rimC = new THREE.PointLight(0x00bfff, 30, 30); rimC.position.set(-7, 5, 3); scene.add(rimC);
const rimP = new THREE.PointLight(0xe91e63, 30, 30); rimP.position.set(7, 5, 3); scene.add(rimP);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + "px"; renderer.domElement.style.height = h + "px";
  camera.aspect = w / h;
  // que siempre quepa la banda completa a lo ancho
  const needW = 12.4, dist = camera.position.distanceTo(new THREE.Vector3(0, 2.55, 0));
  const vfovForW = 2 * Math.atan(needW / 2 / camera.aspect / dist) * 180 / Math.PI;
  camera.fov = Math.max(33, vfovForW);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

// ---------- materiales ----------
const M = {
  purple: new THREE.MeshPhysicalMaterial({ color: 0x5D54A4, roughness: .25, clearcoat: 1, clearcoatRoughness: .15 }),
  dark:   new THREE.MeshPhysicalMaterial({ color: 0x2a2462, roughness: .35, clearcoat: .6 }),
  darker: new THREE.MeshStandardMaterial({ color: 0x1b1640, roughness: .6 }),
  white:  new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: .32, clearcoat: .8, clearcoatRoughness: .2 }),
  cloth:  new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: .75, sheen: 1, sheenColor: new THREE.Color(0xd9d4ff) }),
  steel:  new THREE.MeshPhysicalMaterial({ color: 0xeef0fa, metalness: .45, roughness: .22, clearcoat: 1 }),
  lid:    new THREE.MeshPhysicalMaterial({ color: 0x3a3a52, roughness: .4, clearcoat: .5 }),
  silver: new THREE.MeshStandardMaterial({ color: 0xe8e8f5, metalness: 1, roughness: .2 }),
};
const glow = c => new THREE.MeshBasicMaterial({ color: c, transparent: true, toneMapped: false });

// ---------- logo de pintura (textura) ----------
function badgeTexture(){
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"); g.translate(128, 128); g.scale(4.2, 4.2);
  const dot = (x, y, r, col) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = col; g.fill(); };
  dot(-9, -6, 13, "#00BFFF"); dot(10, -8, 11, "#E91E63"); dot(9, 10, 12, "#FFC93C"); dot(-10, 10, 10, "#3DDC84");
  dot(0, 1, 12, "#5D54A4"); dot(21, -17, 3.5, "#E91E63"); dot(-22, 17, 3, "#00BFFF");
  const p = [0,-8, 2.6,-2.6, 8.5,-2, 4,2, 5.3,8, 0,5, -5.3,8, -4,2, -8.5,-2, -2.6,-2.6];
  g.beginPath(); for (let i = 0; i < p.length; i += 2) g[i ? "lineTo" : "moveTo"](p[i], p[i + 1]); g.closePath(); g.fillStyle = "#fff"; g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const badgeMat = new THREE.MeshPhysicalMaterial({ map: badgeTexture(), transparent: true, roughness: .3, clearcoat: .8, depthWrite: false,
  polygonOffset: true, polygonOffsetFactor: -2 });
function badge(size, x, y, z, rx = 0, ry = 0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), badgeMat.clone());
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.set(rx, ry, 0); g.add(m); return g;
}

// ---------- artículos ----------
const S = 1 / 57;   // px del dibujo original -> unidades
function shirt(){
  const pts = [[-30,-122],[-56,-112],[-80,-86],[-60,-70],[-46,-80],[-46,0],[46,0],[46,-80],[60,-70],[80,-86],[56,-112],[30,-122]];
  const sh = new THREE.Shape(); sh.moveTo(pts[0][0] * S, -pts[0][1] * S);
  pts.slice(1).forEach(([x, y]) => sh.lineTo(x * S, -y * S));
  sh.quadraticCurveTo(0, 102 * S, -30 * S, 122 * S);
  const geo = new THREE.ExtrudeGeometry(sh, { depth: .3, bevelEnabled: true, bevelThickness: .14, bevelSize: .09, bevelSegments: 5, curveSegments: 12 });
  geo.translate(0, .09, -.15);
  const g = new THREE.Group(); const m = new THREE.Mesh(geo, M.cloth); m.castShadow = true; g.add(m);
  g.userData.badge = badge(1.0, 0, 66 * S, .3, 0); g.add(g.userData.badge); return g;
}
function mug(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.74, .74, 1.75, 48), M.white); body.position.y = .875; body.castShadow = true;
  const inside = new THREE.Mesh(new THREE.CircleGeometry(.66, 40), M.darker); inside.rotation.x = -Math.PI / 2; inside.position.y = 1.752;
  const handle = new THREE.Mesh(new THREE.TorusGeometry(.42, .1, 16, 32, Math.PI * 1.15), M.white);
  handle.position.set(.74, .9, 0); handle.rotation.z = -Math.PI * .575; handle.castShadow = true;
  g.add(body, inside, handle);
  g.userData.badge = badge(.95, 0, .9, .755); g.add(g.userData.badge);
  g.rotation.y = -.35; return g;
}
function cap(){
  const g = new THREE.Group();
  const crown = new THREE.Mesh(new THREE.SphereGeometry(.92, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), M.cloth);
  crown.scale.set(1, 1.05, 1); crown.position.y = .3; crown.castShadow = true;
  const band = new THREE.Mesh(new THREE.CylinderGeometry(.93, .93, .3, 40, 1, true), M.cloth); band.position.y = .15;
  const brimShape = new THREE.Shape(); brimShape.absellipse(0, 0, .95, .8, Math.PI, Math.PI * 2, false); brimShape.lineTo(-.95, 0);
  const brim = new THREE.Mesh(new THREE.ExtrudeGeometry(brimShape, { depth: .05, bevelEnabled: true, bevelThickness: .03, bevelSize: .03, bevelSegments: 3 }),
    new THREE.MeshPhysicalMaterial({ color: 0xe9e7fb, roughness: .7, sheen: 1 }));
  brim.rotation.x = Math.PI / 2; brim.position.set(0, .06, .55); brim.castShadow = true;
  const button = new THREE.Mesh(new THREE.SphereGeometry(.08, 16, 10), M.cloth); button.position.y = 1.26;
  g.add(crown, band, brim, button);
  g.userData.badge = badge(.82, 0, .82, .76, -.45); g.add(g.userData.badge);
  g.rotation.y = .5; return g;
}
function thermo(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.47, .47, 2.0, 48), M.steel); body.position.y = 1.0; body.castShadow = true;
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(.42, .44, .36, 40), M.lid); lid.position.y = 2.18; lid.castShadow = true;
  g.add(body, lid);
  g.userData.badge = badge(.72, 0, 1.05, .48); g.add(g.userData.badge); return g;
}

const ITEMS = [
  { make: shirt,  name: "DTF",           fx: "dtf", top: 2.25 },
  { make: mug,    name: "SUBLIMACIÓN",   fx: "sub", top: 1.8 },
  { make: cap,    name: "BORDADO",       fx: "bor", top: 1.3 },
  { make: thermo, name: "GRABADO LÁSER", fx: "las", top: 2.36 },
];
const BELT_Y = .3, SPACING = 4.6;
ITEMS.forEach(it => { it.obj = it.make(); scene.add(it.obj); });

// ---------- banda transportadora ----------
const beltTexCanvas = document.createElement("canvas"); beltTexCanvas.width = 256; beltTexCanvas.height = 32;
{ const g = beltTexCanvas.getContext("2d"); g.fillStyle = "#2f2870"; g.fillRect(0, 0, 256, 32);
  g.fillStyle = "#463d9c"; for (let x = 0; x < 256; x += 64) g.fillRect(x + 8, 0, 26, 32); }
const beltTex = new THREE.CanvasTexture(beltTexCanvas); beltTex.colorSpace = THREE.SRGBColorSpace;
beltTex.wrapS = THREE.RepeatWrapping; beltTex.repeat.set(7, 1);
const BELT_LEN = 14.6;
const beltTop = new THREE.Mesh(new THREE.BoxGeometry(BELT_LEN, .3, 2.3),
  [M.dark, M.dark, new THREE.MeshPhysicalMaterial({ map: beltTex, roughness: .55, clearcoat: .3 }), M.dark, M.dark, M.dark]);
beltTop.position.y = .15; beltTop.receiveShadow = true; scene.add(beltTop);
const rollers = [-1, 1].map(s => {
  const r = new THREE.Mesh(new THREE.CylinderGeometry(.2, .2, 2.4, 24), M.purple); r.rotation.x = Math.PI / 2;
  r.position.set(s * BELT_LEN / 2, .15, 0); scene.add(r);
  const legGeo = new RoundedBoxGeometry(.3, 1.4, .3, 3, .08);
  [-.85, .85].forEach(z => { const l = new THREE.Mesh(legGeo, M.darker); l.position.set(s * (BELT_LEN / 2 - .9), -.7, z); l.castShadow = true; scene.add(l); });
  return r;
});
const frontRail = new THREE.Mesh(new RoundedBoxGeometry(BELT_LEN + .2, .22, .18, 3, .07), M.purple);
frontRail.position.set(0, .3, 1.2); scene.add(frontRail);

// ---------- máquina ----------
const beam = new THREE.Mesh(new RoundedBoxGeometry(12, .32, .5, 4, .15), M.dark); beam.position.set(0, 6.55, -.2); scene.add(beam);
const neck = new THREE.Mesh(new THREE.CylinderGeometry(.16, .16, .5, 16), M.dark); neck.position.set(0, 6.2, -.1); scene.add(neck);
const machine = new THREE.Mesh(new RoundedBoxGeometry(3.6, 2.2, 1.5, 6, .35), M.purple); machine.position.set(0, 4.85, 0); machine.castShadow = true; scene.add(machine);
// pantalla con el nombre de la técnica
const scrCanvas = document.createElement("canvas"); scrCanvas.width = 512; scrCanvas.height = 160;
const scrTex = new THREE.CanvasTexture(scrCanvas); scrTex.colorSpace = THREE.SRGBColorSpace;
let scrText = "";
function drawScreen(t){
  if (t === scrText) return; scrText = t;
  const g = scrCanvas.getContext("2d");
  g.clearRect(0, 0, 512, 160); g.fillStyle = "#0d0b26"; g.beginPath(); g.roundRect(0, 0, 512, 160, 36); g.fill();
  g.font = `900 ${t.length > 10 ? 54 : 70}px Montserrat`; g.textAlign = "center"; g.textBaseline = "middle";
  g.shadowColor = "#00BFFF"; g.shadowBlur = 26; g.fillStyle = "#00BFFF"; g.fillText(t, 256, 84);
  g.shadowBlur = 0; g.fillStyle = "#bff0ff"; g.fillText(t, 256, 84);
  scrTex.needsUpdate = true;
}
const screen = new THREE.Mesh(new THREE.PlaneGeometry(2.9, .9), new THREE.MeshBasicMaterial({ map: scrTex, transparent: true, toneMapped: false }));
screen.position.set(0, 5.25, .76); scene.add(screen);
const lights = ["#00BFFF", "#E91E63", "#FFC93C"].map((c, i) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(.13, 20, 12), glow(c)); m.position.set(-.75 + i * .75, 4.25, .76); scene.add(m); return m;
});
const head = new THREE.Group();
const headMesh = new THREE.Mesh(new THREE.CylinderGeometry(.45, .22, .5, 6), M.dark); headMesh.rotation.y = Math.PI / 6; headMesh.castShadow = true;
const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(.09, .05, .22, 12), M.silver); nozzle.position.y = -.34;
head.add(headMesh, nozzle); head.position.set(0, 3.5, 0); scene.add(head);

// ---------- efectos por técnica ----------
const FX = {};
FX.dtf = new THREE.Group();
["#00BFFF", "#E91E63", "#FFC93C", "#3DDC84", "#5D54A4"].forEach((c, i) => {
  const d = new THREE.Mesh(new THREE.SphereGeometry(.09 + (i % 2) * .03, 16, 12), new THREE.MeshPhysicalMaterial({ color: c, roughness: .1, clearcoat: 1, transparent: true }));
  d.userData = { x: [-.2, .14, -.03, .24, -.28][i], delay: i * .136 }; FX.dtf.add(d);
});
FX.sub = new THREE.Group();
["#FF8A3D", "#E91E63", "#FFC93C"].forEach((c, i) => {
  const r = new THREE.Mesh(new THREE.TorusGeometry(.55, .045, 10, 48), glow(c)); r.rotation.x = Math.PI / 2; r.userData = { delay: i * .283 }; FX.sub.add(r);
});
FX.bor = new THREE.Group();
const needle = new THREE.Mesh(new THREE.CylinderGeometry(.035, .015, .9, 10), M.silver); FX.bor.add(needle);
const thread = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 3.1, .1), new THREE.Vector3(.45, 2.6, .35), new THREE.Vector3(-.4, 2.0, .5), new THREE.Vector3(.1, 1.45, .62)]), 40, .025, 8),
  new THREE.MeshPhysicalMaterial({ color: 0xE91E63, roughness: .5 }));
FX.bor.add(thread);
FX.las = new THREE.Group();
const beamMesh = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, 1, 12), glow("#7fe3ff")); FX.las.add(beamMesh);
const beamGlow = new THREE.Mesh(new THREE.CylinderGeometry(.16, .16, 1, 16), glow("#00BFFF")); beamGlow.material.opacity = .3; FX.las.add(beamGlow);
const laserLight = new THREE.PointLight(0x00bfff, 0, 4); FX.las.add(laserLight);
const sparks = [[-.5, .35], [.45, .45], [-.25, .6], [.35, .2], [0, .55], [-.4, .15]].map(([dx, dy], i) => {
  const s = new THREE.Mesh(new THREE.SphereGeometry(.05, 8, 6), glow(i % 2 ? "#FFC93C" : "#ffffff")); s.userData = { dx, dy, delay: i * .11 }; FX.las.add(s); return s;
});
Object.values(FX).forEach(g => { g.visible = false; scene.add(g); });

// ---------- cinta de técnicas ----------
const techs = ["DTF","Serigrafía","Grabado Láser","Sublimación","Bordado","Gran Formato","Corte en Acrílico","Corte en MDF","DTF UV","Letreros con Luz"];
const colors = ["#00BFFF","#E91E63","#FFC93C","#3DDC84","#a79cff"];
const marquee = document.getElementById("marquee");
marquee.innerHTML = [0, 1, 2].map(() => techs.map((t, i) => `${t}<b style="color:${colors[i % colors.length]}">&nbsp;&nbsp;•&nbsp;&nbsp;</b>`).join("")).join("");

// ---------- línea de tiempo (igual que el taller 2D) ----------
const CYCLE = 3.4, MOVE = 1.3, PRINT_START = 1.5, PRINT_END = 3.0, N = ITEMS.length, LOOP = CYCLE * N;
window.LOOP = LOOP;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clamp = v => Math.max(0, Math.min(1, v));
const blobs = [1, 2, 3, 4].map(i => document.getElementById("b" + i));

function frame(t){
  const cycle = Math.floor(t / CYCLE), tt = t - cycle * CYCLE;
  const moving = tt < MOVE;
  const s = cycle + ease(clamp(tt / MOVE));
  let nearest = null, nd = 99;
  ITEMS.forEach((it, i) => {
    const raw = ((s - i) % N + N) % N, m = raw >= 2 ? raw - 4 : raw;
    it.obj.position.set(m * SPACING, BELT_Y + (moving ? Math.abs(Math.sin(t * 9 + i)) * .04 : 0), 0);
    let sc = m > .001 ? 1 : Math.abs(m) <= .001 ? (moving ? 0 : clamp((tt - PRINT_START - .3) / 1.0)) : 0;
    const pop = sc > 0 && sc < 1 ? 1 + Math.sin(sc * Math.PI) * .25 : 1;
    const b = it.obj.userData.badge; b.scale.setScalar(Math.max(.001, sc * pop)); b.children[0].material.opacity = sc;
    if (Math.abs(m) < nd) { nd = Math.abs(m); nearest = it; }
  });
  drawScreen(nearest.name);
  // banda y rodillos avanzan con los artículos
  beltTex.offset.x = -(s * SPACING / BELT_LEN) * beltTex.repeat.x;
  rollers.forEach(r => r.rotation.y = -s * SPACING / .2);
  // luces que parpadean
  lights.forEach((l, i) => l.material.opacity = ((t + i * .4) % .85) < .425 ? 1 : .3);
  // técnica
  const printing = !moving && tt > PRINT_START && tt < PRINT_END;
  const pt = tt - PRINT_START;
  head.position.y = 3.5 - (printing ? .14 : 0);
  Object.entries(FX).forEach(([k, g]) => g.visible = printing && nearest.fx === k);
  const top = nearest.top + BELT_Y, from = 3.1;
  if (FX.dtf.visible) FX.dtf.children.forEach(d => {
    const p = ((pt + 10 - d.userData.delay) % .68) / .68;
    d.position.set(d.userData.x, from - p * p * (from - top), .1); d.material.opacity = 1 - p * .8;
  });
  if (FX.sub.visible) FX.sub.children.forEach(r => {
    const p = ((pt + 10 - r.userData.delay) % .85) / .85;
    r.position.set(0, from - p * (from - top - .1), 0); r.scale.setScalar(.7 + p * .6); r.material.opacity = Math.sin(p * Math.PI);
  });
  if (FX.bor.visible) { const p = Math.abs(((pt * 5.88) % 2) - 1); needle.position.set(0, 2.85 - p * .55, .1); }
  if (FX.las.visible) {
    const len = from - top; [beamMesh, beamGlow].forEach(m => { m.scale.y = len; m.position.set(0, top + len / 2, .1); });
    const fl = Math.floor(pt / .068) % 2 ? .65 : 1; beamMesh.material.opacity = fl; beamGlow.material.opacity = .3 * fl;
    laserLight.position.set(0, top + .2, .5); laserLight.intensity = 6 * fl;
    sparks.forEach(sp => { const p = ((pt + 10 - sp.userData.delay) % .68) / .68;
      sp.position.set(sp.userData.dx * p, top + sp.userData.dy * p, .5); sp.material.opacity = 1 - p; });
  }
  // fondo y cinta de técnicas
  blobs.forEach((b, i) => { const ph = (t / (i % 2 ? 6.8 : 13.6) + i * .25) * Math.PI * 2;
    b.style.transform = `translate(${(Math.sin(ph) * 2).toFixed(2)}vw,${(-Math.sin(ph) * 2.5).toFixed(2)}vw) scale(${1 + Math.sin(ph) * .08})`; });
  const loopW = marquee.scrollWidth / 3;
  marquee.style.transform = `translateX(${(-((t / LOOP) % 1) * loopW).toFixed(1)}px)`;
  renderer.render(scene, camera);
}

window.renderAt = sec => frame(sec);
const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (RENDER) {
  frame(0);
} else if (REDUCED_MOTION) {
  frame(0); // un solo cuadro estático, sin animar
} else {
  const t0 = performance.now();
  let paused = false;
  document.addEventListener("visibilitychange", () => { paused = document.hidden; });
  const loop = now => {
    if (!paused) frame((now - t0) / 1000);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
